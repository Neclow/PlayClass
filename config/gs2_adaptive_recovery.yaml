# Grounded-SAM-2 Tracker — fixed 60s chunking with recovery mechanisms.
#
# Same pipeline as gs2_fixed.yaml, but with two structural recovery mechanisms
# enabled to match SAM 3's recovery scaffolding:
#   1. Best-frame seed selection over the first `seed_scan_window` frames at
#      chunk 0 (mirrors SAM 3's `text_grounding.grounding_frames=125`).
#   2. GDINO re-init on total carryover loss (mirrors SAM 3's text-grounded
#      mid-video re-init, with the gs2-native grounder).

# =============================================================================
# INPUT / OUTPUT
# =============================================================================
text_prompt: ".bird."
start_frame: 0
max_frames_to_track: 0

# =============================================================================
# CHUNKING — fixed 60s, matching Variant C (SAM3 fixed)
# =============================================================================
chunk_seconds: 60

max_lookback_frames: 10

# =============================================================================
# Grounded-SAM-2 parameters
# =============================================================================
gs2:
  model_size: "large"
  gdino_model_id: "IDEA-Research/grounding-dino-base"
  box_threshold: 0.25
  text_threshold: 0.3
  offload_video_to_cpu: true
  enable_recovery: true
  seed_scan_window: 125
