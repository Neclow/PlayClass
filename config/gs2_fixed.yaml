# Grounded-SAM-2 Tracker — fixed 60s chunking, Day 28
# Videos: C2G2, C5G3 (staged at ext-data/raw/rerun_fixed_day_28/).
# Runs on CUDA 0 (pair with gs2_fixed_day_29.yaml on CUDA 1).
#
# Strict IDEA-Research reference behavior: single GroundingDINO call at
# the thresholds below, no retry loop, no area filter. The only adaptation
# vs upstream is chunking-with-mask-carryover (unavoidable for 15min videos).

# =============================================================================
# INPUT / OUTPUT
# =============================================================================
text_prompt: ".bird."
start_frame: 0
max_frames_to_track: 0

# =============================================================================
# CHUNKING — fixed 60s, matching Variant C (SAM3 fixed)
# =============================================================================
chunk_seconds: 60

# Max frames to look back when extracting carryover masks at chunk boundary.
max_lookback_frames: 10

# =============================================================================
# Grounded-SAM-2 parameters
# =============================================================================
gs2:
  model_size: "large" # SAM2.1 variant
  gdino_model_id: "IDEA-Research/grounding-dino-base" # Swin-B "large" GDINO
  box_threshold: 0.25
  text_threshold: 0.3
  offload_video_to_cpu: true
